# Build, test, lint, and format-check the store-sqlite plugin cdylib on every push/PR.
#
# This crate depends on busbar (../busbarAI, a local path dependency — see the README's
# "Dependencies" section). The busbar repo (GetBusbar/busbar) is public, but 1.5.0's plugin work
# (this crate's actual dependency surface — api, store-sqlite, plugin-sdk, plugin-loader) isn't on
# `main` yet (still pre-release); it lives on the `1.5.0-dev` branch instead, checked out here with
# no token needed since the repo itself is public. Update BUSBAR_REF once 1.5.0 ships and this can
# just track `main`.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUSBAR_REF: 1.5.0-dev

jobs:
  test:
    name: build, test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout store-sqlite
        uses: actions/checkout@v4
        with:
          path: store-sqlite

      - name: Checkout busbar (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: GetBusbar/busbar
          ref: ${{ env.BUSBAR_REF }}
          path: busbarAI

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: cargo fmt --check
        working-directory: store-sqlite
        run: cargo fmt --all -- --check

      - name: cargo build
        working-directory: store-sqlite
        run: cargo build --all-targets

      - name: cargo clippy
        working-directory: store-sqlite
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: store-sqlite
        run: cargo test
